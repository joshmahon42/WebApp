<h2>📅 Weekly Calendar 📅</h2>

<div class="device-info">
  <p><strong>Running on:</strong> {{ deviceInfo?.platform }}</p>
</div>

<form class="event-form" (ngSubmit)="addEvent()">
  <input [(ngModel)]="newEvent.title" name="title" placeholder="Event Title" required />
  <select [(ngModel)]="newEvent.day" name="day" required>
    <option value="" disabled selected>Select Day</option>
    <option *ngFor="let day of days" [value]="day">{{ day }}</option>
  </select>
  <select [(ngModel)]="newEvent.time" name="time" required>
    <option value="" disabled selected>Select Time</option>
    <option *ngFor="let time of times" [value]="time">{{ time }}</option>
  </select>
  <button [disabled]="!newEvent.title || !newEvent.day || !newEvent.time">Add</button>
</form>

<div class="calendar">
  <div class="grid">
    <div class="header-cell time-label">Time</div>
    <div class="header-cell" *ngFor="let day of days" [class.today]="isToday(day)">
      {{ day }}
    </div>

    <ng-container *ngFor="let time of times">
      <div class="time-label">{{ time }}</div>
      <ng-container *ngFor="let day of days">
        <div class="cell">
          <div *ngFor="let event of getEventsForSlot(day, time)" class="event">
            {{ event.title }}
            <button class="delete" (click)="removeEvent(event)">×</button>
          </div>
        </div>
      </ng-container>
    </ng-container>
  </div>
</div>
